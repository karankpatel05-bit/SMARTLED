<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTLED PWA</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Configuration (credentials injected by build) -->
    <script src="config.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- Connection Screen -->
    <div id="connection-screen" class="glass-panel active">
        <div class="logo-container">
            <i class="ph ph-lightbulb bulb-icon"></i>
            <h1>Smart LED</h1>
        </div>
        <p>Fleet Dashboard — Powered by Adafruit IO</p>
        <button id="connect-btn" class="primary-btn">Open Dashboard</button>
        <div id="connection-status"></div>
    </div>

    <!-- Main Controller Screen -->
    <div id="main-screen" class="glass-panel">
        
        <header>
            <div class="status-indicator">
                <div class="dot connected"></div>
                <span id="selected-device-label">No device selected</span>
            </div>
            <div>
                <button id="settings-btn" class="icon-btn" style="display:inline-flex; margin-right: 0.5rem;"><i class="ph ph-gear"></i></button>
                <button id="disconnect-btn" class="icon-btn" style="display:inline-flex;"><i class="ph ph-x"></i></button>
            </div>
        </header>

        <!-- Camera Feed -->
        <div class="camera-container">
            <video id="input-video" playsinline></video>
            <canvas id="output-canvas"></canvas>
        </div>

        <!-- Brightness Status Bar - below camera -->
        <div class="led-status-overlay">
            <i class="ph ph-lightbulb" id="status-icon"></i>
            <div class="progress-bar-container">
                <div id="brightness-bar" class="progress-bar"></div>
            </div>
            <span id="brightness-text">–</span>
        </div>

        <!-- Device Fleet Dashboard -->
        <div id="dashboard"></div>

        <!-- Global Controls (Camera + Voice) -->
        <div class="controls-panel" style="margin-top: 1rem;">
            <button id="mic-btn" class="action-btn">
                <i class="ph ph-microphone"></i>
                <span>Voice</span>
            </button>
            <button id="camera-toggle-btn" class="action-btn">
                <i class="ph ph-camera-rotate"></i>
                <span>Flip Camera</span>
            </button>
        </div>
        <div id="voice-transcript" class="transcript">Say "Turn on" or "Set to 50%" — targets selected device</div>
    </div>

    <!-- Device Manager / Settings Screen -->
    <div id="settings-screen" class="glass-panel" style="display: none;">
        <header>
            <h1>Device Manager</h1>
            <button id="close-settings-btn" class="icon-btn"><i class="ph ph-x"></i></button>
        </header>

        <h3 style="margin-top: 1rem; color: var(--primary); font-size: 0.9rem; text-transform: uppercase;">Discovered Devices</h3>
        <p style="font-size: 0.8rem; margin-bottom: 1rem; color: var(--text-muted); text-align: left;">Devices powered on in the last 5 minutes</p>
        <div id="discovered-list" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem;">
            <!-- Rendered by JS -->
        </div>

        <h3 style="color: var(--primary); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 1rem;">Saved Devices</h3>
        <div id="saved-list" style="display: flex; flex-direction: column; gap: 0.5rem;">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Custom Naming Modal (Non-blocking) -->
    <div id="name-modal" class="glass-panel" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; max-height: unset;">
        <h2 style="margin-bottom: 1rem;">Add Device</h2>
        <p id="modal-mac-display" style="color: var(--text-muted); text-align: left; margin-bottom: 1rem;"></p>
        <div class="input-group">
            <input type="text" id="device-name-input" placeholder="e.g., Living Room">
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button id="modal-cancel-btn" class="primary-btn" style="background: rgba(255,255,255,0.1);">Cancel</button>
            <button id="modal-save-btn" class="primary-btn">Save</button>
        </div>
    </div>
    
    <!-- Modal Overlay -->
    <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; backdrop-filter: blur(4px);"></div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
