<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTLED PWA</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Configuration (credentials injected by build) -->
    <script src="config.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- Connection Screen -->
    <div id="connection-screen" class="glass-panel active">
        <div class="logo-container">
            <i class="ph ph-lightbulb bulb-icon"></i>
            <h1>Smart LED</h1>
        </div>
        <p>Fleet Dashboard — Powered by Adafruit IO</p>
        <button id="connect-btn" class="primary-btn">Open Dashboard</button>
        <div id="connection-status"></div>
    </div>

    <!-- Main Controller Screen -->
    <div id="main-screen" class="glass-panel">
        
        <header>
            <div class="status-indicator">
                <div class="dot connected"></div>
                <span id="selected-device-label">No device selected</span>
            </div>
            <button id="disconnect-btn" class="icon-btn"><i class="ph ph-x"></i></button>
        </header>

        <!-- Camera Feed -->
        <div class="camera-container">
            <video id="input-video" playsinline></video>
            <canvas id="output-canvas"></canvas>
        </div>

        <!-- Brightness Status Bar - below camera -->
        <div class="led-status-overlay">
            <i class="ph ph-lightbulb" id="status-icon"></i>
            <div class="progress-bar-container">
                <div id="brightness-bar" class="progress-bar"></div>
            </div>
            <span id="brightness-text">–</span>
        </div>

        <!-- Device Fleet Dashboard -->
        <div id="dashboard"></div>

        <!-- Global Controls (Camera + Voice) -->
        <div class="controls-panel" style="margin-top: 1rem;">
            <button id="mic-btn" class="action-btn">
                <i class="ph ph-microphone"></i>
                <span>Voice</span>
            </button>
            <button id="camera-toggle-btn" class="action-btn">
                <i class="ph ph-camera-rotate"></i>
                <span>Flip Camera</span>
            </button>
        </div>
        <div id="voice-transcript" class="transcript">Say "Turn on" or "Set to 50%" — targets selected device</div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
